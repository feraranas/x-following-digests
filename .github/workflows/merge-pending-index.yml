name: Merge pending index appends
on:
  workflow_dispatch:
  push:
    paths:
      - 'pending/**.jsonl'
jobs:
  merge:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Append pending JSONL into index.jsonl
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(pending/*.jsonl)
          if [ ${#files[@]} -eq 0 ]; then echo 'nothing to merge'; exit 0; fi
          python3 - <<'PY'
          import json, pathlib
          index_path = pathlib.Path('index.jsonl')
          known=set()
          rows=[]
          if index_path.exists():
              for line in index_path.read_text().splitlines():
                  if not line.strip():
                      continue
                  o=json.loads(line)
                  rows.append(o)
                  tid=str(o.get('tweet_id') or '')
                  if tid:
                      known.add(tid)
          pending_dir=pathlib.Path('pending')
          added=0
          removed=[]
          for pending in sorted(pending_dir.glob('*.jsonl')):
              for line in pending.read_text().splitlines():
                  if not line.strip():
                      continue
                  o=json.loads(line)
                  tid=str(o.get('tweet_id') or '')
                  if tid and tid in known:
                      continue
                  rows.append(o)
                  if tid:
                      known.add(tid)
                  added+=1
              pending.unlink()
              removed.append(str(pending))
          index_path.write_text(''.join(json.dumps(r, ensure_ascii=False, separators=(',', ':')) + '\n' for r in rows))
          print('added', added, 'total', len(rows), 'removed', removed)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then echo 'no changes'; exit 0; fi
          git commit -m "merge pending index appends"
          git push
