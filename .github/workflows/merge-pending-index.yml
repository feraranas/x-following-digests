name: Merge pending index appends
on:
  workflow_dispatch:
  push:
    paths:
      - 'pending/*.jsonl'
jobs:
  merge:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Merge pending into index.jsonl
        run: python3 scripts/merge_pending_index.py
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then echo 'no changes'; exit 0; fi
          git commit -m "merge pending index appends"
          git push
